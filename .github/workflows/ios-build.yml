name: Build unsigned iOS .ipa

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios-client/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios-client
    steps:
      - uses: actions/checkout@v4

      - name: List available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select newest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install fastlane
        run: gem install fastlane -N

      - name: Build unsigned archive
        run: fastlane build

      - name: Package unsigned .ipa from the archive
        env:
          COPYFILE_DISABLE: "1"   # stop macOS cp from writing AppleDouble (._*) resource-fork files
        run: |
          APP_PATH="build/PhoneVR.xcarchive/Products/Applications/PhoneVR.app"
          rm -rf ipa_root
          mkdir -p ipa_root/Payload
          cp -R "$APP_PATH" ipa_root/Payload/
          find ipa_root -name ".DS_Store" -delete
          find ipa_root -name "._*" -delete
          ditto -c -k --keepParent ipa_root/Payload build/PhoneVR-unsigned.ipa
          unzip -l build/PhoneVR-unsigned.ipa | head -20

      - name: Upload unsigned .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneVR-unsigned-ipa
          path: ios-client/build/PhoneVR-unsigned.ipa
          retention-days: 14
